<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101513" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Fronteira Web</title>
  <link rel="stylesheet" href="./css/main.css?v=0.6.32" />
</head>
<body>
  <main class="game-shell" id="game-shell">
    <canvas id="game" width="360" height="800" aria-label="Campo de batalha Fronteira Web"></canvas>

    <button
      id="fullscreen-toggle"
      class="fullscreen-toggle"
      type="button"
      aria-label="Abrir em tela cheia"
      aria-pressed="false"
      title="Tela cheia"
      hidden
    >
      <span class="fullscreen-icon fullscreen-icon-enter" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </span>
      <span class="fullscreen-icon fullscreen-icon-exit" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </span>
    </button>
  </main>

  <script type="module" src="./src/main.js?v=0.6.32"></script>
</body>
</html>
